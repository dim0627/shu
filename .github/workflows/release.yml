name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Tag must match the version in package.json
        run: |
          v=$(jq -r .version package.json)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "package.json version is $v but tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi

      # A tag can point at a commit that CI never ran on.
      - run: bun run typecheck
      - run: bun test

      # Windows is left out: hard link and lock file behavior is unverified there.
      - name: Build binaries for all targets
        run: |
          mkdir -p dist
          for t in darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            bun build src/cli.ts --compile --target="bun-$t" --outfile "dist/shu-$t"
          done
          ls -lh dist/

      - name: Generate checksums
        run: |
          cd dist
          sha256sum shu-* > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
